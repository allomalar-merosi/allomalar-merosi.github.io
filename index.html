<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarbiya va Allomalar Merosi</title>
<meta name="description" content="Tarbiya fanini O‘rta Osiyo allomalari ilmiy merosidan foydalanib o‘qitish: 5–11-sinflar, 8-sinf tajriba moduli va diagnostika.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Noto+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="#home">
      <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" fill="currentColor"/><rect x="5" y="5" width="14" height="14" fill="currentColor" transform="rotate(45 12 12)"/></svg>
      <span class="brand-text"><b>Tarbiya</b><small>Allomalar merosi</small></span>
    </a>
    <nav class="topnav" id="topnav" aria-label="Asosiy bo‘limlar"></nav>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Mavzuni almashtirish">Tun / Kun</button>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>
<footer class="site-foot">
  <div class="wrap">
    <p>Kontent manbasi: “Tarbiya fanini o‘qitish metodikasi” darsligi (Guliston davlat universiteti).</p>
    <p>Dissertatsiya tadqiqoti aprobatsiyasi uchun ishlab chiqilgan platforma.</p>
  </div>
</footer>
<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  (function () {
    var root = document.documentElement;
    try { var t = localStorage.getItem("tarbiya.theme"); if (t) root.setAttribute("data-theme", t); } catch (e) {}
    document.getElementById("theme-btn").addEventListener("click", function () {
      var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      var next = dark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("tarbiya.theme", next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
